name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Add published repository README
        run: |
          cat > ./dist/README.md <<'EOF'
          # Dino-Julius.github.io

          Published GitHub Pages output for Julio Vivas portfolio.

          This repository is generated automatically. The editable source code lives at:

          https://github.com/Dino-Julius/julio-vivas-portfolio

          Deployment flow:

          1. Changes are pushed to `Dino-Julius/julio-vivas-portfolio`.
          2. GitHub Actions builds the React/Vite app.
          3. The generated `dist` folder is pushed here.
          4. GitHub Pages serves this repository at `https://dino-julius.github.io/`.
          
          EOF
          cp ./LICENSE ./dist/LICENSE

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          publish_dir: ./dist
          external_repository: Dino-Julius/Dino-Julius.github.io
          publish_branch: main
          user_name: "GitHub Actions"
          user_email: "actions@github.com"
